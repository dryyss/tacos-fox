<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <title>TACOS FOX Stains : commande en ligne, sur place, à emporter, livraison</title>
  <meta name="description" content="Tacos, burgers, pizzas, bowls et Crousty Fox à Stains (93). Viande halal certifiée Achahada. Commandez en direct, sans appli de livraison.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#app">Aller au contenu</a>

  <!-- Bandeau de confiance : visible dès le haut de la page -->
  <div class="trust-strip" role="note">
    <span class="trust-strip__item"><svg class="ico" aria-hidden="true"><use href="#i-halal"/></svg> Viande halal certifiée Achahada</span>
    <span class="trust-strip__sep" aria-hidden="true"></span>
    <span class="trust-strip__item"><svg class="ico" aria-hidden="true"><use href="#i-direct"/></svg> Commande directe, sans appli de livraison</span>
  </div>

  <header class="header" id="header">
    <a class="brand" href="#/" aria-label="TACOSFOX, accueil">
      <img class="brand__logo" src="assets/logo.svg" alt="" width="40" height="50">
      <span class="brand__text">
        <span class="brand__name">TACOS<span>FOX</span></span>
        <span class="brand__sub">by Paris, since 1998</span>
      </span>
    </a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="#/" data-nav="home">Accueil</a>
      <a href="#/carte" data-nav="carte">La carte</a>
      <a href="#/infos" data-nav="infos">Infos pratiques</a>
    </nav>
    <div class="header__actions">
      <a class="btn btn--ghost btn--sm hide-mobile header__account" href="#/compte" data-nav="compte"><svg class="ico" aria-hidden="true"><use href="#i-user"/></svg>Mon compte</a>
      <a class="btn btn--primary btn--sm hide-mobile" href="#/carte">Commander</a>
      <a class="cart-btn" href="#/panier" aria-label="Voir le panier">
        <svg class="ico" aria-hidden="true"><use href="#i-bag"/></svg>
        <span class="cart-btn__count" data-cart-count hidden>0</span>
        <span class="cart-btn__total hide-mobile" data-cart-total>0,00 €</span>
      </a>
    </div>
  </header>

  <main id="app" class="app" tabindex="-1"></main>

  <!-- Barre panier flottante (mobile, page carte) -->
  <a class="cart-bar" id="cartBar" href="#/panier" hidden>
    <span class="cart-bar__count" data-cart-count>0</span>
    <span class="cart-bar__label">Voir mon panier</span>
    <span class="cart-bar__total" data-cart-total>0,00 €</span>
  </a>

  <!-- Navigation basse (mobile) -->
  <nav class="tabbar" aria-label="Navigation mobile">
    <a href="#/" data-nav="home"><svg class="ico" aria-hidden="true"><use href="#i-home"/></svg><span>Accueil</span></a>
    <a href="#/carte" data-nav="carte"><svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg><span>Carte</span></a>
    <a href="#/panier" data-nav="panier" class="tabbar__cart"><span class="tabbar__cartwrap"><svg class="ico" aria-hidden="true"><use href="#i-bag"/></svg><span class="tabbar__badge" data-cart-count hidden>0</span></span><span>Panier</span></a>
    <a href="#/compte" data-nav="compte"><svg class="ico" aria-hidden="true"><use href="#i-user"/></svg><span>Compte</span></a>
    <a href="#/infos" data-nav="infos"><svg class="ico" aria-hidden="true"><use href="#i-pin"/></svg><span>Infos</span></a>
  </nav>

  <!-- Feuille modale (composeur, fiches produit) -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet__handle" aria-hidden="true"></div>
    <div class="sheet__inner" id="sheetInner"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Pictogrammes -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-halal" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 2l7 3v6c0 5-3.5 9-7 11-3.5-2-7-6-7-11V5z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M8.5 12l2.5 2.5 4.5-5"/></symbol>
      <symbol id="i-direct" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 12h13M12 5l7 7-7 7"/></symbol>
      <symbol id="i-bag" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h10"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 20c1-4 4-6 8-6s7 2 8 6"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 22s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M20 20l-3.5-3.5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.5" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.5" stroke-linecap="round" d="M5 12h14"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.5" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 7v5l3 2"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></symbol>
      <symbol id="i-store" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 9l2-5h14l2 5M3 9h18v2a3 3 0 01-6 0 3 3 0 01-6 0 3 3 0 01-6 0zM5 13v7h14v-7M10 20v-4h4v4"/></symbol>
      <symbol id="i-takeaway" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M6 8h12l1 13H5zM9 8V5a3 3 0 016 0v3"/></symbol>
      <symbol id="i-scooter" viewBox="0 0 24 24"><circle cx="6" cy="17" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="17" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 17h6l1-7h3M13 5h3l2 9M3 12h4"/></symbol>
      <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" d="M3 10h18M7 15h4"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" d="M8 10V7a4 4 0 018 0v3"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2c1 4 5 6 5 11a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4 0-7 1-10z"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l3 6.5 7 .8-5.2 4.8L18.2 21 12 17.5 5.8 21l1.4-6.9L2 9.3l7-.8z"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2z"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 7v6h-6M20 13a8 8 0 10-2.3 5.7"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M15 6l-6 6 6 6"/></symbol>
      <symbol id="i-route" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 20a2 2 0 100-4 2 2 0 000 4zM18 8a2 2 0 100-4 2 2 0 000 4zM8 18h7a3 3 0 000-6H9a3 3 0 010-6h7"/></symbol>
      <symbol id="i-fox" viewBox="0 0 120 120"><path d="M36 14 C26 14 24 2 34 0 C34 -10 54 -12 60 -2 C66 -12 86 -10 86 0 C96 2 94 14 84 14 Z" transform="translate(0 22)" fill="currentColor" opacity=".55"/><path d="M28 36 L48 34 L40 62 Z" fill="currentColor"/><path d="M92 36 L72 34 L80 62 Z" fill="currentColor"/><path d="M33 38 L87 38 C92 58 78 80 60 94 C42 80 28 58 33 38 Z" fill="currentColor"/><circle cx="50" cy="52" r="3.4" fill="#fff" opacity=".9"/><circle cx="70" cy="52" r="3.4" fill="#fff" opacity=".9"/><path d="M55 74 L65 74 L60 81 Z" fill="#fff" opacity=".9"/></symbol>
    </defs>
  </svg>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
